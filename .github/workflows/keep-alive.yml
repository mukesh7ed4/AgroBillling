name: Render Keep-Alive Ping

on:
  schedule:
    # Har 10 minute mein run hoga
    - cron: '*/10 * * * *'
  # Manual trigger bhi enable hai
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://agrobilling-api.onrender.com/health
          echo "Ping sent at $(date)"